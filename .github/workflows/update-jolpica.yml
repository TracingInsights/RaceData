name: Update F1 Datasets (Jolpica)

# The Kaggle datasets (see update-kaggle.yml) are published with a delay.
# Jolpica (https://jolpi.ca) — the community successor of the Ergast F1 API —
# is updated shortly after each session, so this workflow runs on its own
# (faster) schedule to top up data/ with the latest races.
#
# It is also dispatched by update-kaggle.yml (with source=kaggle) right
# after the Kaggle download is committed: the Kaggle download overwrites
# data/ wholesale, so this run re-applies the latest results on top and
# publishes the GitHub Release for the refreshed snapshot.

on:
  schedule:
    # # Daily refresh at 03:00 UTC
    # - cron: '0 3 * * *'
    # # Extra evening run on Sundays to catch results shortly after the race
    # - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      source:
        description: "What initiated this run (a 'kaggle' source publishes a GitHub Release)"
        type: choice
        default: manual
        options:
          - manual
          - kaggle

permissions:
  contents: write

jobs:
  update-from-jolpica:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Update recent races from Jolpica API
        # Refreshes results/qualifying/sprints/lap times/pit stops/standings
        # for any races missing from the data folder and for races held
        # within the last JOLPICA_REFRESH_DAYS (default 7) days.
        # No credentials needed — the public API is rate-limit throttled
        # inside the script.
        run: |
          uv run python update_from_jolpica.py

      - name: Check for changes
        id: check_changes
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in data files"
            echo "changes=true" >> $GITHUB_OUTPUT
            # Also add the zip file if data changed
            git add data.zip
          fi

      - name: Upload to HuggingFace Datasets
        if: steps.check_changes.outputs.changes == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID || 'tracinginsights/test' }}
        run: |
          export COMMIT_DATE="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          uv run python upload_to_hf.py

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get current date for commit message
          COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          git commit -m "chore: update F1 datasets from Jolpica - $COMMIT_DATE" \
                     -m "Automated update of recent Formula 1 races from the Jolpica API (https://jolpi.ca)"

          # Reconcile with anything pushed in the meantime (e.g. the Kaggle
          # workflow) before pushing
          git pull --rebase
          git push

      - name: Create GitHub Release
        # Releases are published only when this run is a follow-up to the
        # Kaggle sync (dispatched with source=kaggle by update-kaggle.yml).
        # At this point data.zip contains the fresh Kaggle snapshot topped
        # up with the latest Jolpica results — exactly the artifact the
        # release should ship.
        if: github.event_name == 'workflow_dispatch' && inputs.source == 'kaggle'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Generate tag name based on commit SHA
          TAG_NAME="data-$(git rev-parse --short HEAD)"
          RELEASE_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          # Create release with the zip file
          gh release create "$TAG_NAME" \
            --title "F1 Dataset - $TAG_NAME" \
            --notes "📊 **Automated F1 Dataset Update**

          **Release Date:** $RELEASE_DATE

          This release contains the latest Formula 1 race data from Kaggle datasets:
          - formula-1-race-data (jtrotman/formula-1-race-data)
          - formula-1-race-events (jtrotman/formula-1-race-events)

          Topped up with the latest rounds from the Jolpica API (https://jolpi.ca).

          **Download:** Use the \`data.zip\` file below to get all datasets in one archive.

          **Data Coverage:** 1950 - Present Season

          ---
          🤖 This release was automatically generated by GitHub Actions." \
            data.zip

      - name: No changes
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "ℹ️ No changes detected in datasets. Repository is up to date."
