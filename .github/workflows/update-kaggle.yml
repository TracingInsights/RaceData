name: Update F1 Datasets (Kaggle)

# Kaggle-only sync: downloads the jtrotman Kaggle datasets (published with a
# delay), rebuilds data/ and data.zip, uploads to HuggingFace and commits.
#
# The Kaggle download overwrites data/ wholesale, which would roll back any
# races previously topped up from Jolpica. So after committing, this workflow
# dispatches the Jolpica workflow (see update-jolpica.yml) with
# source=kaggle; that run re-applies the latest results on top and publishes
# the GitHub Release for the refreshed snapshot.

on:
  # Run every Sunday at 11 PM IST (5:30 PM UTC)
  schedule:
    # - cron: '30 17 * * 0'

  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: write
  # Needed to dispatch the Jolpica workflow after the Kaggle data is pushed
  actions: write

jobs:
  kaggle-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          uv sync --frozen

      - name: Create Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Download datasets and create zip
        # Downloads the Kaggle datasets into data/ (overwriting it
        # wholesale), converts the VSC estimates to CSV and rebuilds
        # data.zip.
        run: |
          uv run python download_datasets.py

      - name: Convert virtual safety car estimates to CSV
        # Conversion is also performed before the data.zip is built inside
        # download_datasets.py; this step ensures the CSV is current for commit.
        run: uv run python convert_vsc.py

      - name: Check for changes
        id: check_changes
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "No changes detected"
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in data files"
            echo "changes=true" >> $GITHUB_OUTPUT
            # Also add the zip file if data changed
            git add data.zip
          fi

      - name: Upload to HuggingFace Datasets
        if: steps.check_changes.outputs.changes == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ vars.HF_REPO_ID || 'tracinginsights/test' }}
        run: |
          export COMMIT_DATE="$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          uv run python upload_to_hf.py

      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Get current date for commit message
          COMMIT_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          git commit -m "chore: update F1 datasets from Kaggle - $COMMIT_DATE" \
                     -m "Automated update of Formula 1 datasets" \
                     -m "- formula-1-race-data (jtrotman/formula-1-race-data)" \
                     -m "- formula-1-race-events (jtrotman/formula-1-race-events)"

          # Reconcile with anything pushed in the meantime (e.g. the Jolpica
          # workflow) before pushing
          git pull --rebase
          git push

      - name: Dispatch Jolpica follow-up sync
        # The Kaggle datasets lag a few race weekends behind; Jolpica
        # (https://jolpi.ca) is updated shortly after each session. Dispatch
        # the Jolpica workflow (with source=kaggle) so it re-applies the
        # latest results on top of the freshly committed Kaggle snapshot and
        # then publishes the GitHub Release for it.
        if: steps.check_changes.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run update-jolpica.yml --ref "${{ github.ref_name }}" -f source=kaggle

      - name: No changes
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "ℹ️ No changes detected in datasets. Repository is up to date."
